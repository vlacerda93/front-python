name: Front Python CI/CD (Fail Fast Pipeline)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sast-and-build:
    name: 1. Build & Docker Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build React Frontend
        run: npm run build

      - name: Build Docker Image
        run: docker build -t front-python:latest .

  lint-quality:
    name: 2. Code Quality & Lint
    runs-on: ubuntu-latest
    needs: [sast-and-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linting
        run: npm run lint || npx oxlint .

  frontend-smoke-test:
    name: 3. Frontend Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Start Vite Dev Server
        run: |
          npm run dev -- --host &
          sleep 5

      - name: Verify Frontend Running (Curl)
        run: |
          curl -f http://localhost:5173
